<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Fence Builders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .tv-container {
            position: relative;
            transform-origin: center;
            animation: none; 
        }

        .tv-container.animate {
            animation: zoom-in 5s forwards;
        }

        .tv-frame {
            width: 80vmin;
            height: auto;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .tv-content {
            position: absolute;
            overflow: hidden;
            background-color: black;
            z-index: 1;
        }

        #static-canvas, #scene-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #scene-canvas {
            display: none;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #start-button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        #start-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .logo {
            font-size: 40px;
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes zoom-in {
            0% {
                transform: scale(0.5);
            }
            100% {
                transform: scale(1.5);
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js"
            }
        }
    </script>
</head>
<body>
    <div id="start-overlay">
        <div class="logo">
            <h1>Premier Fence Builders</h1>
            <p>Building boundaries, creating spaces</p>
        </div>
        <button id="start-button">Start Experience</button>
    </div>

    <div class="container">
        <div class="tv-container">
            <div class="tv-content">
                <canvas id="static-canvas"></canvas>
                <canvas id="scene-canvas"></canvas>
            </div>
            <img src="tv_frame.png" alt="TV Frame" class="tv-frame">
        </div>
    </div>
    <audio id="static-sound" src="static_noise.mp3" loop></audio>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { createNoise2D } from 'simplex-noise';

        // Get DOM elements
        const staticCanvas = document.getElementById('static-canvas');
        const sceneCanvas = document.getElementById('scene-canvas');
        const staticSound = document.getElementById('static-sound');
        const tvContainer = document.querySelector('.tv-container');
        const startOverlay = document.getElementById('start-overlay');
        const startButton = document.getElementById('start-button');
        const tvContent = document.querySelector('.tv-content');

        // Completely redesigned TV screen area detection function
        async function detectTvScreenArea() {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = 'tv_frame.png';
                
                img.onload = function() {
                    console.log(`TV frame image loaded: ${img.width}x${img.height}`);
                    
                    // Create canvas for analysis
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw image to canvas
                    ctx.drawImage(img, 0, 0);
                    
                    // Get image data
                    const imageData = ctx.getImageData(0, 0, img.width, img.height);
                    const data = imageData.data;
                    
                    // Analyze entire image to find transparent area
                    const transparentPixels = [];
                    const alphaThreshold = 50; // Pixels with alpha less than this are considered transparent
                    
                    // First pass: identify all transparent pixels
                    for (let y = 0; y < img.height; y++) {
                        for (let x = 0; x < img.width; x++) {
                            const idx = (y * img.width + x) * 4 + 3; // Alpha channel index
                            if (data[idx] < alphaThreshold) {
                                transparentPixels.push({ x, y });
                            }
                        }
                    }
                    
                    console.log(`Found ${transparentPixels.length} transparent pixels`);
                    
                    // If no transparent pixels found, use fallback values
                    if (transparentPixels.length === 0) {
                        console.warn("No transparent pixels found in the TV frame image");
                        applyFallbackValues();
                        resolve();
                        return;
                    }
                    
                    // Find the bounding box of transparent pixels
                    let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
                    
                    for (const pixel of transparentPixels) {
                        minX = Math.min(minX, pixel.x);
                        maxX = Math.max(maxX, pixel.x);
                        minY = Math.min(minY, pixel.y);
                        maxY = Math.max(maxY, pixel.y);
                    }
                    
                    // Calculate width and height of transparent area
                    const width = maxX - minX + 1;
                    const height = maxY - minY + 1;
                    
                    console.log(`Transparent area bounds: X(${minX}-${maxX}), Y(${minY}-${maxY})`);
                    console.log(`Transparent area dimensions: ${width}x${height}`);
                    
                    // Validate detection (to avoid tiny or obviously wrong areas)
                    const minAreaRatio = 0.1; // Transparent area should be at least 10% of image
                    const areaRatio = (width * height) / (img.width * img.height);
                    
                    if (areaRatio < minAreaRatio) {
                        console.warn(`Detected area too small (${(areaRatio * 100).toFixed(2)}% of image)`);
                        applyFallbackValues();
                        resolve();
                        return;
                    }
                    
                    // Apply the detected dimensions as percentages
                    const screenLeft = (minX / img.width) * 100;
                    const screenTop = (minY / img.height) * 100;
                    const screenWidth = (width / img.width) * 100;
                    const screenHeight = (height / img.height) * 100;
                    
                    // Set the TV content dimensions
                    tvContent.style.left = `${screenLeft}%`;
                    tvContent.style.top = `${screenTop}%`;
                    tvContent.style.width = `${screenWidth}%`;
                    tvContent.style.height = `${screenHeight}%`;
                    
                    console.log(`Applied TV content position: left=${tvContent.style.left}, top=${tvContent.style.top}, width=${tvContent.style.width}, height=${tvContent.style.height}`);
                    
                    // Debug visualization (uncomment if needed for debugging)
                    /*
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(minX, minY, width, height);
                    document.body.appendChild(canvas);
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.left = '0';
                    canvas.style.zIndex = '100';
                    canvas.style.transform = 'scale(0.3)';
                    canvas.style.transformOrigin = 'top left';
                    */
                    
                    // Resize canvases
                    handleResize();
                    resolve();
                };
                
                img.onerror = () => {
                    console.error("Failed to load TV frame image");
                    applyFallbackValues();
                    resolve();
                };
                
                function applyFallbackValues() {
                    // Conservative fallback values
                    tvContent.style.left = '11%';
                    tvContent.style.top = '11%';
                    tvContent.style.width = '78%';
                    tvContent.style.height = '60%';
                    console.log("Using fallback TV content dimensions");
                }
            });
        }

        // Set up canvases
        const staticCtx = staticCanvas.getContext('2d');

        // Initialize variables
        let animationFrameId;
        let isStaticPlaying = false; 
        const noise2D = createNoise2D();

        // Wait for user interaction before starting
        startButton.addEventListener('click', () => {
            // Remove the overlay
            startOverlay.style.display = 'none';
            
            // Start the experience
            startExperience();
        });

        // Function to start the experience after user interaction
        function startExperience() {
            // Add animation class to TV container
            tvContainer.classList.add('animate');
            
            // Start playing static sound with error handling
            staticSound.play().catch(error => {
                console.log('Audio playback failed:', error);
                // Continue with visuals even if audio fails
            });
            
            // Start the static visual effect
            isStaticPlaying = true;
            drawStatic();
            
            // After the zoom animation completes, transition to 3D scene
            setTimeout(() => {
                transitionTo3DScene();
            }, 5000); // 5 seconds, same as our zoom animation
        }

        // Improved static effect with randomized pattern
        function drawStatic() {
            if (!isStaticPlaying) return;
            
            const { width, height } = staticCanvas;
            
            // Clear previous frame
            staticCanvas.width = width;
            staticCanvas.height = height;
            
            // Create image data for new frame
            const imageData = staticCtx.createImageData(width, height);
            const data = imageData.data;
            
            // Generate high-contrast black and white static
            for (let i = 0; i < data.length; i += 4) {
                // More pronounced static with 0 or 255 (pure black or white)
                const value = Math.random() > 0.5 ? 255 : 0;
                data[i] = value;       // Red
                data[i + 1] = value;   // Green
                data[i + 2] = value;   // Blue
                data[i + 3] = 255;     // Alpha
            }
            
            // Apply the static pattern
            staticCtx.putImageData(imageData, 0, 0);
            
            // Continue animation
            animationFrameId = requestAnimationFrame(drawStatic);
        }

        function transitionTo3DScene() {
            // Stop static animation
            isStaticPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            // Fade out static sound
            let volume = 1;
            const fadeInterval = setInterval(() => {
                volume -= 0.1;
                if (volume <= 0) {
                    staticSound.pause();
                    clearInterval(fadeInterval);
                } else {
                    staticSound.volume = volume;
                }
            }, 100);
            
            // Hide static canvas, show 3D canvas
            staticCanvas.style.opacity = 0;
            sceneCanvas.style.display = 'block';
            
            // Initialize 3D scene
            init3DScene();
        }

        function init3DScene() {
            // Set up Three.js scene
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, sceneCanvas.offsetWidth / sceneCanvas.offsetHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, alpha: true });
            renderer.setSize(sceneCanvas.offsetWidth, sceneCanvas.offsetHeight);
            
            // Add lighting for sunrise effect
            const sunLight = new THREE.DirectionalLight(0xffdfb5, 1);
            sunLight.position.set(-10, 5, 10);
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            // Create grass terrain
            const terrainGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
            
            // Apply noise to vertices to create hills
            const position = terrainGeometry.attributes.position;
            for (let i = 0; i < position.count; i++) {
                const x = position.getX(i);
                const z = position.getZ(i);
                
                // Apply perlin noise for natural terrain
                const elevation = noise2D(x * 0.05, z * 0.05) * 5;
                position.setY(i, elevation);
            }
            
            terrainGeometry.computeVertexNormals();
            
            // Create grass material
            const terrainMaterial = new THREE.MeshStandardMaterial({
                color: 0x7cfc00,
                flatShading: false,
            });
            
            const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
            terrain.rotation.x = -Math.PI / 2;
            scene.add(terrain);
            
            // Add sky with sunrise gradient
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
            const sunriseColors = [
                new THREE.Color(0x1e1e2f), // Dark blue (top)
                new THREE.Color(0x5b3b63), // Purple
                new THREE.Color(0xff9e6d), // Orange
                new THREE.Color(0xffdf91)  // Yellow (bottom, sunrise)
            ];
            
            // Create sky material with gradient
            const skyMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vPosition;
                    void main() {
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 middleColor1;
                    uniform vec3 middleColor2;
                    uniform vec3 bottomColor;
                    varying vec3 vPosition;
                    
                    void main() {
                        float h = normalize(vPosition).y;
                        vec3 color;
                        
                        if (h > 0.5) {
                            color = mix(middleColor1, topColor, (h - 0.5) * 2.0);
                        } else if (h > 0.0) {
                            color = mix(middleColor2, middleColor1, h * 2.0);
                        } else {
                            color = mix(bottomColor, middleColor2, h + 1.0);
                        }
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                uniforms: {
                    topColor: { value: sunriseColors[0] },
                    middleColor1: { value: sunriseColors[1] },
                    middleColor2: { value: sunriseColors[2] },
                    bottomColor: { value: sunriseColors[3] },
                },
                side: THREE.BackSide
            });
            
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);
            
            // Add sun
            const sunGeometry = new THREE.SphereGeometry(20, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff80 });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(-100, -20, 100);
            scene.add(sun);
            
            // Set camera position
            camera.position.set(0, 10, 25);
            camera.lookAt(0, 0, 0);
            
            // Add controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Animation function
            function animate() {
                requestAnimationFrame(animate);
                
                // Slowly move the sun upward for sunrise effect
                if (sun.position.y < 50) {
                    sun.position.y += 0.05;
                    // Adjust lighting as sun rises
                    sunLight.intensity = 1 + (sun.position.y / 20);
                }
                
                controls.update();
                renderer.render(scene, camera);
            }
            
            // Start animation
            animate();
            
            // Handle resize
            window.addEventListener('resize', () => {
                sceneCanvas.width = sceneCanvas.offsetWidth;
                sceneCanvas.height = sceneCanvas.offsetHeight;
                camera.aspect = sceneCanvas.offsetWidth / sceneCanvas.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(sceneCanvas.offsetWidth, sceneCanvas.offsetHeight);
            });
        }

        // Resize event handlers
        function handleResize() {
            if (staticCanvas) {
                staticCanvas.width = staticCanvas.offsetWidth;
                staticCanvas.height = staticCanvas.offsetHeight;
            }
            
            if (sceneCanvas) {
                sceneCanvas.width = sceneCanvas.offsetWidth;
                sceneCanvas.height = sceneCanvas.offsetHeight;
            }
            
            console.log(`Canvases resized to: ${staticCanvas.width}x${staticCanvas.height}`);
        }

        // Ensure we properly load and analyze the image before starting
        window.addEventListener('load', async () => {
            console.log("Page loaded, detecting TV screen area...");
            
            // First detect the TV screen area
            await detectTvScreenArea();
            
            // Then setup the canvases
            handleResize();
            
            console.log("Setup complete, ready for user interaction");
        });
        
        window.addEventListener('resize', handleResize);
    </script>
